name: Go MCP service
on:
  push:
    branches: [main]
    paths: [service/**, skills/**, Dockerfile, .dockerignore, tools/check_service.py, tools/deploy_gcp.sh, .gcloudignore, .github/workflows/service.yml]
  pull_request:
    paths: [service/**, skills/**, Dockerfile, .dockerignore, tools/check_service.py, tools/deploy_gcp.sh, .gcloudignore, .github/workflows/service.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: service-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v6
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum
      - run: python skills/websummit-planner/scripts/export_text.py --out service/data
      - run: go vet ./...
        working-directory: service
      - run: go test -race ./...
        working-directory: service
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o server .
        working-directory: service
      - run: python tools/check_service.py
      - run: docker build -t websummit-mcp:test .
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.WS_DEPLOY_GCP == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: bash tools/deploy_gcp.sh "$GCP_PROJECT" "$GCP_REGION"
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
