name: Web distribution
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install tzdata
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_web.py --out dist
        env:
          WS_GPT_URL: ${{ vars.WS_GPT_URL }}
          WS_GEM_URL: ${{ vars.WS_GEM_URL }}
          WS_MCP_URL: ${{ vars.WS_MCP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/websummit-planner.zip
            dist/schedule-*.md
            dist/side-events.md
            dist/schedule.json
            dist/agenda.py
            dist/web-instructions.md
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Fixed tag, moved to this commit; fail loudly on anything but "release already exists".
          if gh release view web-latest >/dev/null 2>&1; then
            gh release edit web-latest --target "$GITHUB_SHA"
          else
            gh release create web-latest --target "$GITHUB_SHA" --title "Web distribution (latest)" --notes "Skill ZIP and text exports"
          fi
          gh release upload web-latest release/* --clobber
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
